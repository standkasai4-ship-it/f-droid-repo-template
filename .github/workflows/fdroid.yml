name: Build App Store

on:
  push:
    paths:
      - 'fdroid/repo/*.apk'
      - '.github/workflows/*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver default-jdk-headless
          mkdir -p fdroid/repo
          cd fdroid/repo
          gh release list --repo ${{ github.repository }} --limit 20 --json tagName -q '.[].tagName' | while read tag; do
            gh release download "$tag" --repo ${{ github.repository }} --pattern "*.apk" --clobber || true
          done
          cd ..
          if [ ! -f config.yml ]; then
            fdroid init --repo-keyalias myrepo --no-prompt
          fi
          fdroid update --create-metadata --use-date-from-apk
          cd ..
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add fdroid/repo/* fdroid/metadata/* || true
          git add -f fdroid/config.yml fdroid/keystore.p12 || true
          git commit -m "Update repo index" || exit 0
          git push
