name: Build App Store

on:
  push:
    paths:
      - 'fdroid/repo/*.apk'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver default-jdk-headless
          mkdir -p fdroid/repo
          cd fdroid
          if [ ! -f config.yml ]; then
            fdroid init --repo-keyalias myrepo --no-prompt
          fi
          fdroid update --create-metadata --use-date-from-apk
          keytool -list -v -keystore keystore.p12 -storepass $(grep keystorepass config.yml | awk '{print $2}') -storetype PKCS12 | grep "SHA256:"
          cd ..
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add fdroid/
          git commit -m "Update" || exit 0
          git push
