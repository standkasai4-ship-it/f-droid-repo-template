<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropApp — Каталог приложений</title>
    <link rel="icon" type="image/png" href="raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/fdroid/repo/icons/dropiconl.png">
    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b21;
            --surface-hover: #22262f;
            --border: #2a2f3a;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --primary: #3b82f6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
        }
        .container { max-width: 980px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }
        .brand img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--surface);
        }
        .brand h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 11px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: var(--surface-hover); }
        .btn-client {
            background: var(--accent);
            color: #052e16;
            border: none;
        }
        .btn-client:hover { background: var(--accent-hover); color: #fff; }
        .search {
            width: 100%;
            padding: 15px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 16px;
            margin-bottom: 24px;
            outline: none;
        }
        .search:focus { border-color: var(--primary); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
        }
        .card:hover { background: var(--surface-hover); transform: translateY(-2px); }
        .card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
        .card-icon {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            object-fit: cover;
            background: #232730;
            flex-shrink: 0;
        }
        .card-title { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; }
        .card-meta { font-size: 13px; color: var(--text-muted); }
        .card-summary {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 18px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn-wide {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            display: block;
            transition: 0.2s;
        }
        .btn-green { background: var(--accent); color: #052e16; }
        .btn-green:hover { background: var(--accent-hover); color: #fff; }
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            margin-top: 10px;
        }
        .btn-secondary:hover { background: var(--surface-hover); }

        /* Страница игры (широкий макет как на скриншоте) */
        .detail-view { display: none; }
        .detail-back { margin-bottom: 18px; }
        .detail-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 32px 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .detail-icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            object-fit: cover;
            background: #232730;
            margin: 0 auto 16px auto;
            display: block;
        }
        .detail-title { margin: 0 0 6px 0; font-size: 28px; font-weight: 700; }
        .detail-pkg { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .detail-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid var(--border);
            padding-top: 18px;
            gap: 10px;
        }
        .stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .stat-val { font-size: 15px; font-weight: 600; }
        .detail-desc-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-top: 20px;
            line-height: 1.6;
            color: #d1d5db;
            white-space: pre-line;
        }
        .status { color: var(--text-muted); font-size: 15px; padding: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="brand" onclick="showCatalog()">
            <img src="raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/fdroid/repo/icons/dropiconl.png" alt="DropApp" onerror="this.style.display='none'">
            <h1>DropApp</h1>
        </div>
        <div class="header-actions">
            <a href="raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/DropApp.apk" class="btn btn-client" download>Скачать DropApp</a>
            <button onclick="copyRepo()" class="btn">Репозиторий</button>
            <a href="https://t.me" target="_blank" class="btn">Добавить приложение</a>
        </div>
    </header>

    <!-- Главный экран: каталог -->
    <div id="catalog-view">
        <input type="text" id="search" class="search" placeholder="Поиск по названию..." oninput="renderApps()">
        <div id="status" class="status">Загрузка каталога...</div>
        <div id="grid" class="grid"></div>
    </div>

    <!-- Страница игры (широкий макет) -->
    <div id="detail-view" class="detail-view">
        <div class="detail-back">
            <button onclick="showCatalog()" class="btn">Назад в каталог</button>
        </div>
        <div class="detail-hero">
            <img id="d-icon" class="detail-icon" src="" alt="" onerror="this.style.display='none'">
            <h2 id="d-title" class="detail-title"></h2>
            <div id="d-pkg" class="detail-pkg"></div>
            <div class="detail-stats">
                <div>
                    <div class="stat-label">Версия</div>
                    <div id="d-ver" class="stat-val">—</div>
                </div>
                <div>
                    <div class="stat-label">Размер</div>
                    <div id="d-size" class="stat-val">—</div>
                </div>
                <div>
                    <div class="stat-label">Платформа</div>
                    <div class="stat-val">Android</div>
                </div>
            </div>
        </div>

        <a id="d-download-client" href="https://raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/DropApp.apk" class="btn-wide btn-green" download>Скачать DropApp</a>
        <a id="d-download-apk" href="#" class="btn-wide btn-secondary" download>Скачать APK напрямую</a>

        <div id="d-desc" class="detail-desc-box"></div>
    </div>
</div>

<script>
    const REPO_URL = "https://raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/fdroid/repo";
    const FULL_REPO_LINK = REPO_URL + "?fingerprint=AC1FBE685451705B7C820184AF3A51AC4FE7689398BEFF710F0697FF1C102C3F";
    let allApps = [];

    function copyRepo() {
        navigator.clipboard.writeText(FULL_REPO_LINK);
        alert("Ссылка на репозиторий DropApp скопирована!\nВставьте её в приложении в разделе Репозитории.");
    }

    function formatBytes(bytes) {
        if (!bytes) return "—";
        const mb = bytes / (1024 * 1024);
        return mb.toFixed(1) + " МБ";
    }

    function getLocalized(obj) {
        if (!obj) return "";
        if (typeof obj === "string") return obj;
        return obj["ru-RU"] || obj["ru"] || obj["en-US"] || Object.values(obj)[0] || "";
    }

    async function loadRepo() {
        const statusEl = document.getElementById("status");
        try {
            const res = await fetch(REPO_URL + "/index-v2.json?t=" + Date.now());
            if (!res.ok) throw new Error("Индекс не найден");
            const data = await res.json();
            const packages = data.packages || {};

            allApps = Object.keys(packages).map(pkgName => {
                const pkg = packages[pkgName];
                const meta = pkg.metadata || {};
                const versions = Object.values(pkg.versions || {});
                const latest = versions.sort((a, b) => (b.manifest?.versionCode || 0) - (a.manifest?.versionCode || 0))[0];

                let iconPath = getLocalized(meta.icon);
                if (iconPath && typeof iconPath === "object") iconPath = iconPath.name || "";
                const iconUrl = iconPath ? (REPO_URL + iconPath) : "";

                const apkFile = latest?.file?.name || "";
                const apkUrl = apkFile ? (REPO_URL + apkFile) : "#";

                return {
                    id: pkgName,
                    name: getLocalized(meta.name) || pkgName,
                    summary: getLocalized(meta.summary) || "Приложение из каталога DropApp",
                    description: getLocalized(meta.description) || getLocalized(meta.summary) || "Описание отсутствует.",
                    version: latest?.manifest?.versionName || "1.0",
                    size: formatBytes(latest?.file?.size),
                    icon: iconUrl,
                    apk: apkUrl
                };
            });

            if (allApps.length === 0) {
                statusEl.textContent = "Список пуст или база ещё обновляется.";
            } else {
                statusEl.style.display = "none";
                renderApps();
            }
        } catch (e) {
            statusEl.textContent = "Список пуст или база ещё обновляется.";
        }
    }

    function renderApps() {
        const q = document.getElementById("search").value.toLowerCase();
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        allApps.filter(a => a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q)).forEach(app => {
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = () => openDetail(app);
            card.innerHTML = `
                <div>
                    <div class="card-top">
                        ${app.icon ? `<img src="${app.icon}" class="card-icon" onerror="this.style.display='none'">` : ""}
                        <div>
                            <h3 class="card-title">${app.name}</h3>
                            <div class="card-meta">v${app.version} • ${app.size}</div>
                        </div>
                    </div>
                    <div class="card-summary">${app.summary}</div>
                </div>
                <a href="raw.githubusercontent.com/standkasai4-ship-it/f-droid-repo-template/main/DropApp.apk" class="btn-wide btn-green" onclick="event.stopPropagation()" download>Скачать</a>
            `;
            grid.appendChild(card);
        });
    }

    function openDetail(app) {
        document.getElementById("catalog-view").style.display = "none";
        const detail = document.getElementById("detail-view");
        detail.style.display = "block";

        const iconEl = document.getElementById("d-icon");
        if (app.icon) {
            iconEl.src = app.icon;
            iconEl.style.display = "block";
        } else {
            iconEl.style.display = "none";
        }

        document.getElementById("d-title").textContent = app.name;
        document.getElementById("d-pkg").textContent = app.id;
        document.getElementById("d-ver").textContent = app.version;
        document.getElementById("d-size").textContent = app.size;
        document.getElementById("d-desc").textContent = app.description;
        document.getElementById("d-download-apk").href = app.apk;
        window.scrollTo(0, 0);
    }

    function showCatalog() {
        document.getElementById("detail-view").style.display = "none";
        document.getElementById("catalog-view").style.display = "block";
    }

    loadRepo();
</script>
</body>
</html>
