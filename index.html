<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropApp — Каталог приложений</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #e5e5ea; padding-bottom: 15px; }
        h1 { margin: 0; font-size: 26px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: 14px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-outline { background: #fff; color: #1d1d1f; border: 1px solid #d2d2d7; }
        .btn-outline:hover { background: #f0f0f5; }
        .btn-dark { background: #1d1d1f; color: #fff; }
        .btn-dark:hover { background: #333; }
        .search { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid #d2d2d7; font-size: 16px; box-sizing: border-box; margin-bottom: 25px; outline: none; }
        .search:focus { border-color: #0071e3; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
        .card-icon { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: #eee; }
        .card-title { font-weight: 600; font-size: 17px; margin: 0 0 4px 0; }
        .card-pkg { font-size: 12px; color: #86868b; word-break: break-all; }
        .card-desc { font-size: 14px; color: #424245; margin-bottom: 16px; line-height: 1.4; }
        .btn-install { display: block; text-align: center; background: #0071e3; color: #fff; padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 500; }
        .btn-install:hover { background: #0077ed; }
        .status { color: #6e6e73; font-size: 15px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>DropApp — Каталог</h1>
        <div class="actions">
            <a href="https://t.me" target="_blank" class="btn btn-outline">Добавить приложение</a>
            <button onclick="copyRepo()" class="btn btn-dark">Репозиторий для DropApp</button>
        </div>
    </header>

    <input type="text" id="search" class="search" placeholder="Поиск по названию..." oninput="renderApps()">
    <div id="status" class="status">Загрузка каталога...</div>
    <div id="grid" class="grid"></div>
</div>

<script>
    const REPO_URL = "https://githubusercontent.com";
    const FULL_REPO_LINK = REPO_URL + "?fingerprint=AC1FBE685451705B7C820184AF3A51AC4FE7689398BEFF710F0697FF1C102C3F";
    let allApps = [];

    function copyRepo() {
        navigator.clipboard.writeText(FULL_REPO_LINK);
        alert("Ссылка на репозиторий DropApp скопирована!\nВставьте её в приложении в разделе Репозитории.");
    }

    function getLocalized(obj) {
        if (!obj) return "";
        if (typeof obj === "string") return obj;
        return obj["ru-RU"] || obj["ru"] || obj["en-US"] || Object.values(obj)[0] || "";
    }

    async function loadRepo() {
        const statusEl = document.getElementById("status");
        try {
            const res = await fetch(REPO_URL + "/index-v2.json?t=" + Date.now());
            if (!res.ok) throw new Error("Файл индекса не найден");
            const data = await res.json();
            const packages = data.packages || {};

            allApps = Object.keys(packages).map(pkgName => {
                const pkg = packages[pkgName];
                const meta = pkg.metadata || {};
                const versions = Object.values(pkg.versions || {});
                const latest = versions.sort((a, b) => (b.manifest?.versionCode || 0) - (a.manifest?.versionCode || 0))[0];

                let iconPath = getLocalized(meta.icon);
                if (iconPath && typeof iconPath === "object") iconPath = iconPath.name || "";
                const iconUrl = iconPath ? (REPO_URL + iconPath) : "";

                const apkFile = latest?.file?.name || "";
                const apkUrl = apkFile ? (REPO_URL + apkFile) : "#";

                return {
                    id: pkgName,
                    name: getLocalized(meta.name) || pkgName,
                    summary: getLocalized(meta.summary) || getLocalized(meta.description) || "Приложение из каталога DropApp",
                    version: latest?.manifest?.versionName || "",
                    icon: iconUrl,
                    apk: apkUrl
                };
            });

            if (allApps.length === 0) {
                statusEl.textContent = "Список пуст или база ещё обновляется.";
            } else {
                statusEl.style.display = "none";
                renderApps();
            }
        } catch (e) {
            statusEl.textContent = "Список пуст или база ещё обновляется.";
        }
    }

    function renderApps() {
        const q = document.getElementById("search").value.toLowerCase();
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        allApps.filter(a => a.name.toLowerCase().includes(q) || a.id.toLowerCase().includes(q)).forEach(app => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        ${app.icon ? `<img src="${app.icon}" class="card-icon" onerror="this.style.display='none'">` : ""}
                        <div>
                            <h3 class="card-title">${app.name}</h3>
                            <div class="card-pkg">${app.id} ${app.version ? "• v" + app.version : ""}</div>
                        </div>
                    </div>
                    <div class="card-desc">${app.summary}</div>
                </div>
                <a href="${app.apk}" class="btn-install">Скачать APK</a>
            `;
            grid.appendChild(card);
        });
    }

    loadRepo();
</script>
</body>
</html>
